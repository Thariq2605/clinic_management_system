<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ClinixOne Care Operations</title>
    <meta name="description"
        content="Sign in to ClinixOne — the clinic management system for healthcare professionals.">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- ClinixOne admin base (CSS variables, font, reset) -->
    <link rel="stylesheet" href="../css/admin.css">

    <!-- ClinixOne login-specific styles -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- =====================================================
     LOGIN PAGE WRAPPER
     ===================================================== -->
    <div class="login-page-wrapper">

        <div class="login-card">

            <!-- ── Brand header ───────────────────────────── -->
            <div class="login-brand">
                <div class="login-brand-icon"><img src="../assests/images/images.png" alt="Hospital Logo">
                </div>
                <div class="login-brand-text">
                    <div class="login-brand-name">Clinic Management System</div>
                </div>
            </div>

            <div class="login-brand-divider"></div>

            <!-- ── Welcome copy ───────────────────────────── -->
            <div class="login-welcome">
                <h1>Welcome Back</h1>
                <p>Sign in to access the clinic administrative workspace</p>
            </div>

            <!-- ── Error alert (auth.js writes textContent + style.display directly) -->
            <!-- ID "loginErrorAlert" is required by auth.js — keep this div flat   -->
            <div id="loginErrorAlert" class="login-alert" role="alert"></div>

            <!-- ── Login form ─────────────────────────────── -->
            <!-- ID "loginForm" is required by auth.js         -->
            <form id="loginForm" class="login-form" novalidate>

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <!-- ID "username" is required by auth.js -->
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Enter your username" autocomplete="username" required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <!-- ID "password" is required by auth.js -->
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter your password" autocomplete="current-password" required>
                        <!-- Password show / hide toggle -->
                        <button type="button" class="btn-pwd-toggle" id="togglePassword"
                            aria-label="Toggle password visibility" title="Show / hide password">
                            <!-- Eye icon (shown when password is hidden) -->
                            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <!-- Eye-off icon (shown when password is visible) -->
                            <svg id="eyeOffIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                style="display:none;">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit button -->
                <!-- ID "loginSubmitBtn" is required by auth.js -->
                <button type="submit" id="loginSubmitBtn" class="login-submit-btn">
                    Sign In
                </button>

            </form>

            <!-- ── Security badge ─────────────────────────── -->
            <div class="login-security-badge">
                <span class="badge-dot"></span>
                Secure Admin Access · 256-bit Encrypted
            </div>

            <!-- ── Footer ─────────────────────────────────── -->
            <div class="login-footer">
                Healthcare Management System
            </div>

        </div><!-- /.login-card -->

    </div><!-- /.login-page-wrapper -->

    <!-- Password show/hide — pure UI, no auth logic touched -->
    <script>
        (function () {
            /* ── Password toggle ───────────────────────────────── */
            var toggleBtn = document.getElementById('togglePassword');
            var pwdInput = document.getElementById('password');
            var eyeIcon = document.getElementById('eyeIcon');
            var eyeOffIcon = document.getElementById('eyeOffIcon');

            if (toggleBtn && pwdInput) {
                toggleBtn.addEventListener('click', function () {
                    var isHidden = pwdInput.type === 'password';
                    pwdInput.type = isHidden ? 'text' : 'password';
                    eyeIcon.style.display = isHidden ? 'none' : '';
                    eyeOffIcon.style.display = isHidden ? '' : 'none';
                    toggleBtn.setAttribute('aria-label',
                        isHidden ? 'Hide password' : 'Show password');
                });
            }

            /* ── Error alert visual enhancement ───────────────── */
            // auth.js sets: errorAlert.textContent = msg  (wipes children)
            //               errorAlert.style.display = "block" / "none"
            // We only watch the style attribute change to add/remove our CSS classes.
            var errorAlert = document.getElementById('loginErrorAlert');

            if (errorAlert) {
                new MutationObserver(function () {
                    var visible = errorAlert.style.display === 'block';
                    if (visible) {
                        errorAlert.classList.remove('shake');
                        void errorAlert.offsetWidth; // force reflow to restart animation
                        errorAlert.classList.add('shake');
                    }
                }).observe(errorAlert, { attributes: true, attributeFilter: ['style'] });
            }
        })();
    </script>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
