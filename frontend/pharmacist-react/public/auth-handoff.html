<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifying clinic access</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#23384b;font:15px system-ui,sans-serif}.card{width:min(420px,calc(100% - 40px));padding:32px;border:1px solid #e2e9ee;border-radius:14px;background:#fff;text-align:center;box-shadow:0 14px 44px #16334712}.spinner{width:28px;height:28px;margin:0 auto 18px;border:3px solid #d8ebe6;border-top-color:#187c72;border-radius:50%;animation:spin .7s linear infinite}.failed{color:#9c3e43}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="card"><div class="spinner" aria-hidden="true"></div><p id="handoff-status" role="status" aria-live="polite">Verifying your clinic session…</p></main><script src="/auth-handoff.js" defer></script></body></html>
