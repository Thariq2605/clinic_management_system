<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receptionist Login - Clinic Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <i class="bi bi-hospital"></i>
      </div>
      <h4 class="fw-bold mb-1 text-dark">Clinic Management System</h4>
      <p class="text-muted small mb-0">Receptionist Portal</p>
    </div>

    <!-- Error Alert Box -->
    <div id="login-error-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <!-- Session Expired Notification -->
    <div id="session-expired-alert" class="alert alert-warning py-2 small d-none" role="alert">
      <i class="bi bi-info-circle me-1"></i> Your session has expired. Please sign in again.
    </div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-person"></i>
          </span>
          <input
            type="text"
            class="form-control border-start-0 ps-0"
            id="username"
            name="username"
            placeholder="Enter receptionist username"
            required
            autocomplete="username"
          >
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-lock"></i>
          </span>
          <input
            type="password"
            class="form-control border-start-0 ps-0 border-end-0"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
          <button class="btn btn-outline-secondary border-start-0 bg-transparent text-muted" type="button" id="toggle-password-btn">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary py-2" id="login-submit-btn">
          <span>Sign In to Dashboard</span>
          <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </div>
    </form>

    <div class="text-center mt-3 text-muted small">
      <span>Protected by Clinic Management Session Authentication</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Check if user is already signed in
      checkAuth(false);

      // Check URL query parameters for session expiration
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("expired") === "1") {
        document.getElementById("session-expired-alert").classList.remove("d-none");
      }

      // Toggle password visibility
      const togglePasswordBtn = document.getElementById("toggle-password-btn");
      const passwordInput = document.getElementById("password");
      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener("click", () => {
          const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
          passwordInput.setAttribute("type", type);
          togglePasswordBtn.innerHTML = type === "password" ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        });
      }

      // Handle form submit
      const loginForm = document.getElementById("login-form");
      const submitBtn = document.getElementById("login-submit-btn");
      const errorBox = document.getElementById("login-error-alert");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        handleLogin(username, password, submitBtn, errorBox);
      });
    });
  </script>
</body>
</html>
