<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEDICARE - Pharmacist Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css?v=2.0">
</head>
<body>

<div id="app" class="app">
  <!-- Sidebar -->
  <aside id="side" class="side" aria-label="Main navigation">
    <div class="brand">
      <img src="../assets/logo-white.svg" alt="MEDICARE" height="36">
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-footer">
      <button class="nav-logout-btn" data-a="logout">
        <i class="bi bi-box-arrow-right"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Mobile Scrim -->
  <div class="scrim" data-a="menu"></div>

  <!-- Content Area -->
  <div class="content">
    <header class="top">
      <button class="btn ghost menu" data-a="menu" aria-label="Open menu">
        <i class="bi bi-list"></i>
      </button>
      <div class="top-title-group">
        <h1 id="title" class="top-title">Dashboard</h1>
        <small class="top-subtitle">MEDICARE · Pharmacy Module</small>
      </div>
      <div class="top-user-group">
        <div class="user-badge">
          <div class="user-avatar" id="userAvatar">P</div>
          <div class="user-details">
            <span id="who" class="user-name">Pharmacist</span>
            <small class="user-role">Pharmacy Department</small>
          </div>
        </div>
        <button class="btn btn-outline-danger btn-sm rounded-pill px-3" data-a="logout" title="Sign Out">
          <i class="bi bi-box-arrow-right me-1"></i> Sign Out
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>
  </div>
</div>

<dialog id="modal"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=2.0"></script>
</body>
</html>
