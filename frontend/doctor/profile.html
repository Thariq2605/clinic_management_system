<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CareFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">
<div class="app-container">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
        <header class="topbar">
            <div class="doctor-profile">
                <div class="doctor-avatar" id="profileHeaderAvatar">DR</div>
                <div class="doctor-info">
                    <strong id="profileHeaderName">Doctor</strong>
                    <span>Doctor</span>
                </div>
            </div>
        </header>
        <section class="page-content">
            <div class="page-header">
                <div>
                    <h1>Profile</h1>
                    <p>Your signed-in doctor account information</p>
                </div>
            </div>
            <div class="patient-profile-card">
                <div class="patient-avatar-large"><span id="profileInitials">DR</span></div>
                <div class="patient-main-info">
                    <h2 id="profileDoctorName">Doctor</h2>
                    <p>Doctor ID: <strong id="profileDoctorId">Not available</strong></p>
                </div>
            </div>
            <div class="details-card">
                <div class="details-card-header">
                    <h2>Account Information</h2>
                    <p>Information available from your signed-in session</p>
                </div>
                <div class="details-grid">
                    <div class="detail-item">
                        <span class="detail-label">User ID</span>
                        <strong id="profileUserId">Not available</strong>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Username</span>
                        <strong id="profileUsername">Not available</strong>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
