<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDICARE - Clinic Management System</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="text-center">
    <img src="assets/logo.svg" alt="MEDICARE" height="52" class="mb-4 d-block mx-auto">
    <div class="spinner-border text-primary mb-3" style="width: 2.75rem; height: 2.75rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <h6 class="text-secondary fw-medium">Loading MEDICARE Clinical System...</h6>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const receptionistUser = sessionStorage.getItem("clinic_user");
      const doctorToken = localStorage.getItem("access_token");
      const doctorId = localStorage.getItem("doctor_id");
      const pharmacistUser = localStorage.getItem("user");

      if (receptionistUser) {
        window.location.href = "dashboard.html";
      } else if (doctorToken && doctorId) {
        window.location.href = "doctor/dashboard.html";
      } else if (pharmacistUser) {
        window.location.href = "pharmacist/index.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
